spring:
  application:
    name: ms-tenpo-calculator

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cache:
    expiration: ${CACHE_EXPIRATION}
    maximum-size: ${CACHE_MAX_SIZE}
    cache-name: percentageCache

  external:
    percentage:
      url: ${PERCENTAGE_SERVICE_URL}
      endpoint: /api/percentage
      timeout: ${PERCENTAGE_TIMEOUT}
      max-retries: ${PERCENTAGE_MAX_RETRIES}

  openapi:
    title: Tenpo Calculator API
    description: API for calculating sums with dynamic percentage
    version: 1.0.0
    contact-name: ${CONTACT_NAME:Tenpo Team}
    contact-email: ${CONTACT_EMAIL:contact@tenpo.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%8X{requestId:-system}] %-5level %logger{20} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.jesuspacheco.tenpo: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
