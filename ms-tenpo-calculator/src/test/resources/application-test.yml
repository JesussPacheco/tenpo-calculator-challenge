spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    org.testcontainers: DEBUG
    org.flywaydb: DEBUG
    com.jesuspacheco.tenpo: DEBUG
    org.hibernate.SQL: DEBUG